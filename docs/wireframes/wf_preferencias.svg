<text x='106' y='507' font-size='10.5' fill='#333333'>Tienes 1 limitación activa. Se usa para filtrar recetas y generar el calendario.</text>
<rect x='480' y='618' width='110' height='36' rx='6' fill='#ffffff' stroke='#333333' stroke-width='1.5'/><text x='535' y='641' text-anchor='middle' font-size='11' font-weight='700' fill='#333333'>Cancelar</text>
<rect x='606' y='618' width='134' height='36' rx='6' fill='#6b6b6b'/><text x='673' y='641' text-anchor='middle' font-size='11' font-weight='700' fill='#ffffff'>Guardar cambios</text>
<rect x='780' y='184' width='380' height='170' rx='6' fill='#ffffff' stroke='#9a9a9a' stroke-width='1.3' stroke-dasharray='5 4'/>
<text x='800' y='214' font-size='11' font-weight='700' fill='#333333'>Notas de la pantalla</text>
<text x='800' y='240' font-size='10' fill='#6b6b6b'>1. El tipo de dieta y las alergias alimentan el motor de reglas.</text>
<text x='800' y='262' font-size='10' fill='#6b6b6b'>2. Las alergias se marcan y desmarcan con un clic.</text>
<text x='800' y='284' font-size='10' fill='#6b6b6b'>3. Guardar actualiza las preferencias del usuario.</text>
<text x='800' y='306' font-size='10' fill='#6b6b6b'>4. Cancelar descarta los cambios sin guardar.</text>
<text x='600' y='806' text-anchor='middle' font-size='11' fill='#6b6b6b'>FORMULARIO DE PREFERENCIAS</text>
