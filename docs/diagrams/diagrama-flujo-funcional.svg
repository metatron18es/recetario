<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 1060' width='100%' font-family="'Liberation Sans','Arial',sans-serif">
<rect x='0' y='0' width='940' height='1060' fill='#faf6ef'/>
<defs>
  <marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'>
    <path d='M0,0 L10,5 L0,10 z' fill='#5b6358'/>
  </marker>
  <marker id='arrowT' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'>
    <path d='M0,0 L10,5 L0,10 z' fill='#c1622d'/>
  </marker>
</defs>
<text x='30' y='28' font-size='11' font-weight='700' letter-spacing='1.5' fill='#5b6358'>FLUJO FUNCIONAL · GENERACIÓN DEL CALENDARIO SEMANAL</text>
<rect x='290.0' y='30' width='360' height='50' rx='25.0' fill='#1f3821'/>
<text x='470' y='52.0' text-anchor='middle' font-size='11.5' font-weight='700' fill='white'>Usuario pulsa “Generar calendario</text>
<text x='470' y='66.0' text-anchor='middle' font-size='11.5' font-weight='700' fill='white'>semanal”</text>
<line x1='470' y1='80' x2='470' y2='120' stroke='#5b6358' stroke-width='1.5' marker-end='url(#arrow)'/>
<rect x='260.0' y='120' width='420' height='64' rx='8' fill='#ffffff' stroke='#3a5a40' stroke-width='1.6'/>
<rect x='260.0' y='120' width='8' height='64' rx='4' fill='#3a5a40'/>
<text x='476' y='148.5' text-anchor='middle' font-size='11' font-weight='600' fill='#20261f'>Cargar preferencias nutricionales y</text>
<text x='476' y='163.5' text-anchor='middle' font-size='11' font-weight='600' fill='#20261f'>alergias del usuario</text>
<line x1='470' y1='184' x2='470' y2='224' stroke='#5b6358' stroke-width='1.5' marker-end='url(#arrow)'/>
<rect x='260.0' y='224' width='420' height='56' rx='8' fill='#ffffff' stroke='#3a5a40' stroke-width='1.6'/>
<rect x='260.0' y='224' width='8' height='56' rx='4' fill='#3a5a40'/>
<text x='476' y='256.0' text-anchor='middle' font-size='11' font-weight='600' fill='#20261f'>Obtener catálogo de recetas disponibles</text>
<line x1='470' y1='280' x2='470' y2='320' stroke='#5b6358' stroke-width='1.5' marker-end='url(#arrow)'/>
<polygon points='470,320 690.0,385.0 470,450 250.0,385.0' fill='#faf6ef' stroke='#c1622d' stroke-width='1.8'/>
<text x='470' y='382.0' text-anchor='middle' font-size='10.6' font-weight='700' fill='#20261f'>¿Cumple la dieta y no contiene</text>
<text x='470' y='396.0' text-anchor='middle' font-size='10.6' font-weight='700' fill='#20261f'>alérgenos del usuario?</text>
<line x1='470' y1='450' x2='470' y2='486' stroke='#5b6358' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='480' y='472.0' font-size='9.5' fill='#5b6358'>sí</text>
<path d='M690.0 385.0 H760.0 V252 H680' fill='none' stroke='#c1622d' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#arrowT)'/>
<text x='766.0' y='318.5' font-size='9.3' fill='#c1622d'>no → se descarta,<tspan x='766.0' dy='12'>se prueba otra receta</tspan></text>
<rect x='250.0' y='486' width='440' height='56' rx='8' fill='#ffffff' stroke='#3a5a40' stroke-width='1.6'/>
<rect x='250.0' y='486' width='8' height='56' rx='4' fill='#3a5a40'/>
<text x='476' y='503.0' text-anchor='middle' font-size='11' font-weight='600' fill='#20261f'>Agrupar recetas válidas por tipo de</text>
<text x='476' y='518.0' text-anchor='middle' font-size='11' font-weight='600' fill='#20261f'>comida (desayuno · comida · cena ·</text>
<text x='476' y='533.0' text-anchor='middle' font-size='11' font-weight='600' fill='#20261f'>snack)</text>
<line x1='470' y1='542' x2='470' y2='582' stroke='#5b6358' stroke-width='1.5' marker-end='url(#arrow)'/>
<rect x='250.0' y='582' width='440' height='64' rx='8' fill='#ffffff' stroke='#3a5a40' stroke-width='1.6'/>
<rect x='250.0' y='582' width='8' height='64' rx='4' fill='#3a5a40'/>
<text x='476' y='610.5' text-anchor='middle' font-size='11' font-weight='600' fill='#20261f'>Asignar una receta a cada celda del</text>
<text x='476' y='625.5' text-anchor='middle' font-size='11' font-weight='600' fill='#20261f'>calendario (7 días × 4 comidas)</text>
<line x1='470' y1='646' x2='470' y2='686' stroke='#5b6358' stroke-width='1.5' marker-end='url(#arrow)'/>
<polygon points='470,686 690.0,751.0 470,816 250.0,751.0' fill='#faf6ef' stroke='#c1622d' stroke-width='1.8'/>
<text x='470' y='748.0' text-anchor='middle' font-size='10.6' font-weight='700' fill='#20261f'>¿Calorías diarias dentro del</text>
<text x='470' y='762.0' text-anchor='middle' font-size='10.6' font-weight='700' fill='#20261f'>objetivo (±10%)?</text>
<line x1='470' y1='816' x2='470' y2='852' stroke='#5b6358' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='480' y='838.0' font-size='9.5' fill='#5b6358'>sí</text>
<path d='M690.0 751.0 H760.0 V614 H690' fill='none' stroke='#c1622d' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#arrowT)'/>
<text x='766.0' y='682.5' font-size='9.3' fill='#c1622d'>no → se reajusta<tspan x='766.0' dy='12'>la selección</tspan></text>
<rect x='260.0' y='852' width='420' height='56' rx='8' fill='#ffffff' stroke='#3a5a40' stroke-width='1.6'/>
<rect x='260.0' y='852' width='8' height='56' rx='4' fill='#3a5a40'/>
<text x='476' y='876.5' text-anchor='middle' font-size='11' font-weight='600' fill='#20261f'>Guardar EntradaCalendario en la base de</text>
<text x='476' y='891.5' text-anchor='middle' font-size='11' font-weight='600' fill='#20261f'>datos</text>
<line x1='470' y1='908' x2='470' y2='944' stroke='#5b6358' stroke-width='1.5' marker-end='url(#arrow)'/>
<rect x='270.0' y='944' width='400' height='50' rx='25.0' fill='#c1622d'/>
<text x='470' y='966.0' text-anchor='middle' font-size='11.5' font-weight='700' fill='white'>Mostrar el calendario semanal al</text>
<text x='470' y='980.0' text-anchor='middle' font-size='11.5' font-weight='700' fill='white'>usuario</text>
</svg>